name: Defensive Python quality gates

on:
  push:
    branches: [master, "hardening/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile supported defensive entry points
        run: python -m py_compile main.py safe_assessment.py safe_feature_guard.py command_center.py exploitation_techniques.py
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
