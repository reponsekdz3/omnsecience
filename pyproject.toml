[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisec-defensive-assessment"
version = "0.2.0"
description = "Scope-bound, non-invasive TCP exposure assessment"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
omnisec-assess = "safe_assessment:main"

[tool.setuptools]
py-modules = [
  "safe_assessment",
  "safe_feature_guard",
  "legacy_compat",
  "command_center",
  "safe_gui",
  "main",
]
